# Phase C — backend dependency & safe test suite CI.
# Does not enable Atlas / shared-DB integration flags.
name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary supported CI targets (wheels widely available).
        python-version: ["3.12", "3.13"]
        include:
          # 3.14 has lxml/pypdf wheels as of lxml 6.1.x; keep non-blocking until
          # the full stack is proven on GitHub runners.
          - python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    env:
      # Safe synthetic secrets for unit tests only — not production credentials.
      JWT_SECRET: "ci-test-jwt-secret-key-32chars-min!!"
      JWT_ALGORITHM: "HS256"
      JWT_ISSUER: "agentic-ci"
      JWT_AUDIENCE: "agentic-ci-clients"
      # Explicitly leave destructive / live DB integrations OFF.
      RAG_ACL_INTEGRATION: "0"
      MEMORY_PERSISTENCE_INTEGRATION: "0"
      AUTH_TEST_MONGO_URI: ""
      RAG_TEST_DATABASE: ""
      # Avoid accidental provider calls in unit tests.
      GROQ_API_KEY: "test-not-a-real-key"
      GROQ_TIMEOUT_SECONDS: "60"
      GROQ_MAX_RETRIES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Dependency smoke tests
        run: python -m unittest tests.test_deps_smoke -v

      - name: RAG parsers and Batch 1
        run: |
          python -m unittest \
            tests.test_rag_batch1_critical_fixes \
            tests.test_rag_batch1_document_intelligence \
            -v

      - name: Agent Topics 33–40 + Phase A/B regressions
        run: |
          python -m unittest \
            tests.test_agent_state \
            tests.test_agent_context \
            tests.test_agent_routing \
            tests.test_agent_planning \
            tests.test_agent_tool_selection \
            tests.test_agent_reflection \
            tests.test_agent_retry \
            tests.test_agent_stopping \
            tests.test_tool_path_security \
            tests.test_chat_rate_limit \
            tests.test_upload_rate_limit_api \
            tests.test_upload_rate_limit_service \
            tests.test_upload_body_limit \
            tests.test_auth_api \
            -v

      - name: Full safe backend suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee full_suite.log
          echo "---- skip / fail summary ----"
          grep -E '^(FAILED|ERROR|OK|Ran |.*skipped)' full_suite.log || true

      - name: Batch E offline gates (no live secrets)
        run: |
          python -m unittest \
            tests.integration.test_batch_e_offline_gates \
            tests.integration.test_live_providers_batch_e.BatchEProviderMockOffline \
            tests.integration.test_rag_batch_e.BatchERagOfflineContracts \
            -v

  # Explicitly gated live canaries. Never runs on pull_request (forks must not
  # receive disposable secrets). Requires repository variable BATCH_E_LIVE_ENABLED=true
  # plus disposable secrets. If secrets/variable are absent, this job is skipped.
  batch-e-live:
    name: Batch E live canaries (gated)
    runs-on: ubuntu-latest
    # Never on pull_request (forks must not receive disposable secrets).
    # Repository variable + disposable Mongo secrets required; otherwise NOT RUN.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.BATCH_E_LIVE_ENABLED == 'true' &&
      secrets.BATCH_E_MONGO_URI != '' &&
      secrets.BATCH_E_MEMORY_TEST_DATABASE != ''
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: "ci-batch-e-jwt-secret-key-32chars-min!!"
      MONGO_URI: ${{ secrets.BATCH_E_MONGO_URI }}
      MEMORY_TEST_DATABASE: ${{ secrets.BATCH_E_MEMORY_TEST_DATABASE }}
      RAG_TEST_DATABASE: ${{ secrets.BATCH_E_RAG_TEST_DATABASE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.BATCH_E_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.BATCH_E_UPSTASH_REDIS_REST_TOKEN }}
      BATCH_E_REDIS_NAMESPACE: agent:batche:ci:
      BATCH_E_MONGO_INTEGRATION: "1"
      BATCH_E_REDIS_INTEGRATION: "1"
      BATCH_E_RAG_INTEGRATION: "1"
      # Paid providers remain off unless secrets + flags are both present.
      BATCH_E_LIVE_GEMINI: ${{ secrets.BATCH_E_LIVE_GEMINI_FLAG }}
      BATCH_E_LIVE_GROQ: ${{ secrets.BATCH_E_LIVE_GROQ_FLAG }}
      BATCH_E_LIVE_TAVILY: ${{ secrets.BATCH_E_LIVE_TAVILY_FLAG }}
      GOOGLE_API_KEY: ${{ secrets.BATCH_E_GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.BATCH_E_GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.BATCH_E_TAVILY_API_KEY }}
      BATCH_E_GEMINI_MAX_REQUESTS: "3"
      BATCH_E_GROQ_MAX_REQUESTS: "2"
      BATCH_E_TAVILY_MAX_REQUESTS: "2"
      GROQ_MAX_RETRIES: "0"
      # Keep Batch C / production ACL flags off.
      RAG_ACL_INTEGRATION: "0"
      MEMORY_PERSISTENCE_INTEGRATION: "0"
      BATCH_C_MONGO_INTEGRATION: "0"
      BATCH_C_REDIS_INTEGRATION: "0"
      BATCH_C_RAG_INTEGRATION: "0"
      BATCH_C_LIVE_EMBEDDINGS: "0"
      BATCH_C_LIVE_GROQ: "0"
      BATCH_C_LIVE_TAVILY: "0"
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Batch E live Mongo / Redis / RAG (gated)
        run: |
          set -o pipefail
          python -m unittest \
            tests.integration.test_mongo_batch_e \
            tests.integration.test_redis_batch_e \
            tests.integration.test_rag_batch_e \
            tests.integration.test_live_providers_batch_e \
            -v 2>&1 | tee batch_e_live.log
          echo "---- Batch E live summary ----"
          grep -E '^(FAILED|ERROR|OK|Ran |.*skipped)' batch_e_live.log || true
